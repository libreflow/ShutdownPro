<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShutdownPro</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main class="container">
      <h1>ShutdownPro</h1>
      <p class="subtitle">Programmez l'extinction ou le redémarrage de votre PC</p>

      <div class="card">
        <label id="action-label" class="eyebrow">Action</label>
        <div class="row toggle-row" role="group" aria-labelledby="action-label">
          <button id="action-shutdown-btn" type="button" class="toggle active">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v8" /><path d="M18.36 6.64a9 9 0 1 1-12.73 0" /></svg>
            Éteindre
          </button>
          <button id="action-restart-btn" type="button" class="toggle">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36" /><path d="M21 3v6h-6" /></svg>
            Redémarrer
          </button>
        </div>

        <label id="mode-label" class="eyebrow">Quand</label>
        <div class="row toggle-row" role="group" aria-labelledby="mode-label">
          <button id="mode-relative-btn" type="button" class="toggle active">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 2 L17 2 L7 22 L17 22 Z" /></svg>
            Dans…
          </button>
          <button id="mode-absolute-btn" type="button" class="toggle">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9" /><path d="M12 7v5l3 3" /></svg>
            À heure fixe
          </button>
        </div>

        <div id="delay-select-wrap" class="select-wrap">
          <button
            id="delay-select-btn"
            type="button"
            class="select-trigger"
            aria-haspopup="listbox"
            aria-expanded="false"
            aria-controls="delay-select-list"
          >
            <span id="delay-select-value">5 minutes</span>
            <svg class="icon select-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6" /></svg>
          </button>
          <ul
            id="delay-select-list"
            class="select-list"
            role="listbox"
            aria-label="Délai avant l'action"
            inert
          >
            <li role="option" tabindex="-1" data-value="60">1 minute</li>
            <li role="option" tabindex="-1" data-value="300" aria-selected="true">5 minutes</li>
            <li role="option" tabindex="-1" data-value="600">10 minutes</li>
            <li role="option" tabindex="-1" data-value="900">15 minutes</li>
            <li role="option" tabindex="-1" data-value="1800">30 minutes</li>
            <li role="option" tabindex="-1" data-value="2700">45 minutes</li>
            <li role="option" tabindex="-1" data-value="3600">1 heure</li>
            <li role="option" tabindex="-1" data-value="7200">2 heures</li>
            <li role="option" tabindex="-1" data-value="custom">Personnalisé…</li>
          </ul>
        </div>

        <div id="custom-row" class="custom-row" inert>
          <div class="custom-row-inner">
            <div class="custom-row-fields">
              <input
                id="custom-input"
                type="number"
                min="1"
                max="1440"
                step="1"
                placeholder="Minutes"
                aria-label="Délai personnalisé, en minutes (24h max)"
                aria-describedby="custom-input-error"
              />
              <span>minutes</span>
            </div>
            <p id="custom-input-error" class="field-error" role="alert"></p>
          </div>
        </div>

        <div id="time-row" class="custom-row" inert>
          <div class="custom-row-inner">
            <div class="custom-row-fields">
              <input
                id="time-input"
                type="time"
                aria-label="Heure de déclenchement"
                aria-describedby="time-input-hint"
              />
            </div>
            <p id="time-input-hint" class="field-hint" aria-live="polite"></p>
          </div>
        </div>

        <div class="row actions">
          <button id="start-btn" type="button" class="primary">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9" /><path d="M12 7v5l3 3" /></svg>
            Programmer
          </button>
          <button id="cancel-btn" type="button" class="secondary">
            Annuler
          </button>
        </div>

        <div id="status" class="status">
          <span
            id="status-label"
            class="status-label"
            role="status"
            aria-live="polite"
          ></span>
          <span id="status-timer" class="status-timer hidden" aria-hidden="true"></span>
        </div>

        <hr class="divider" />

        <label class="checkbox-row">
          <input type="checkbox" id="autostart-checkbox" class="checkbox-input" />
          <span class="checkbox-box" aria-hidden="true">
            <svg class="checkbox-check" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3 3 7-7" /></svg>
          </span>
          Démarrer avec Windows
        </label>
      </div>
    </main>
  </body>
</html>
